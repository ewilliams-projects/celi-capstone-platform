# Builds site/index.html with run.py and publishes it to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest
      - name: Build site
        run: python run.py
      - name: Check that no draft content is published
        run: |
          if grep -nE 'NEIGHBORHOODS|Sample data|Sample [A-T]\b|rankings|id="map"' site/index.html; then
            echo "::error::Draft neighborhood content found in site/index.html"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
